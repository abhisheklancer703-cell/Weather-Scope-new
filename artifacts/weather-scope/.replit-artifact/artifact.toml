kind = "web"
previewPath = "/"
title = "WeatherScope"
version = "1.0.0"
id = "artifacts/weather-scope"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25668

[services.development]
run = "pnpm --filter @workspace/weather-scope run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/weather-scope", "run", "build" ]
publicDir = "artifacts/weather-scope/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25668"
BASE_PATH = "/"
